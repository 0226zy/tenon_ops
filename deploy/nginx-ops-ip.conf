# Exact-host server block for Tenon Ops. Keeping this in a separate file makes
# /ops survive Tenon redeploys that rewrite sites-available/tenon.
# Replace __SERVER_IP__ and install as sites-available/tenon-ops, then symlink
# into sites-enabled. The included snippet contains the /ops and /api/ops/v1
# locations plus the source-IP allowlist.
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_IP__ 127.0.0.1;

    root /data/server/web;
    index index.html;
    client_max_body_size 2m;

    include /etc/nginx/snippets/tenon-ops.conf;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate";
    }
}
