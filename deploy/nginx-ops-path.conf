# Include this inside the existing nginx :80 default server.
# It exposes Tenon Ops at /ops/ without touching Tenon's /, /api/ or /assets/.
# Replace the allow entries with your source IP/VPN egress. Never use "allow all"
# while the console is HTTP-only and MFA is not implemented.
#
# Build the matching frontend with: VITE_BASE=/ops/ npm run build
# The app itself still listens on 127.0.0.1:7200.

location = /ops {
    return 308 /ops/;
}

location /ops/ {
    allow 203.0.113.10;
    allow 127.0.0.1;
    allow ::1;
    deny all;

    proxy_pass http://127.0.0.1:7200/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

location /api/ops/v1/ {
    allow 203.0.113.10;
    allow 127.0.0.1;
    allow ::1;
    deny all;

    proxy_pass http://127.0.0.1:7200;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
