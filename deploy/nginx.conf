# /etc/nginx/sites-enabled/tenon-ops.conf
# Define the rate limit in the http{} block (e.g. /etc/nginx/conf.d/tenon-ops.conf):
#   limit_req_zone $binary_remote_addr zone=tenon_ops_login:10m rate=10r/m;
#
# Only this server block should expose the admin UI. 7200 stays loopback-only.

server {
    listen 443 ssl http2;
    server_name admin.example.com;

    ssl_certificate     /etc/letsencrypt/live/admin.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;

    # Replace with your office/VPN egress address. Do not use 0.0.0.0/0.
    allow 203.0.113.10;
    deny  all;

    client_max_body_size 2m;

    location /api/ops/v1/auth/login {
        limit_req zone=tenon_ops_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:7200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:7200;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name admin.example.com;
    return 301 https://$host$request_uri;
}
